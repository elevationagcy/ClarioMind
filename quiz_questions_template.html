<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quiz Question Template 1 (Revised)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3B82F6", // Lighter royal blue
                        "primary-dark": "#1D4ED8",
                        "background-light": "#F0F4F8", 
                        "background-dark": "#0F172A", 
                        "card-light": "#FFFFFF",
                        "card-dark": "#1E293B",
                        "text-light": "#1E293B",
                        "text-dark": "#F8FAFC",
                        "secondary-text-light": "#64748B",
                        "secondary-text-dark": "#94A3B8",
                        "option-bg": "#F8FAFC",
                        "option-bg-dark": "#334155",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    }
                },
            },
        };
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: max(884px, 100dvh);
            -webkit-tap-highlight-color: transparent;
        }input[type="radio"]:checked + div {
            border-color: #3B82F6;
            background-color: #EFF6FF;
        }
        .dark input[type="radio"]:checked + div {
            background-color: #1E3A8A;border-color: #3B82F6;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark min-h-screen flex flex-col transition-colors duration-200 relative overflow-x-hidden">
<div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[10%] -right-[10%] w-[50%] h-[40%] rounded-full bg-blue-200/30 dark:bg-blue-900/10 blur-3xl"></div>
<div class="absolute top-[40%] -left-[10%] w-[40%] h-[30%] rounded-full bg-indigo-200/30 dark:bg-indigo-900/10 blur-3xl"></div>
<div class="absolute bottom-[10%] right-[10%] w-[60%] h-[40%] rounded-full bg-purple-100/30 dark:bg-purple-900/10 blur-3xl"></div>
</div>
<header class="sticky top-0 z-20 px-6 py-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-sm">
<div class="max-w-md mx-auto w-full flex items-center justify-between mb-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-card-dark shadow-sm text-secondary-text-light dark:text-secondary-text-dark hover:text-primary dark:hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span>
</button>
<div class="flex flex-col items-center">
<span class="text-xs font-semibold tracking-wider text-secondary-text-light dark:text-secondary-text-dark uppercase">Question 3 of 10</span>
</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-card-dark shadow-sm text-secondary-text-light dark:text-secondary-text-dark hover:text-red-500 dark:hover:text-red-400 transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="max-w-md mx-auto w-full">
<div class="h-1.5 w-full bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-[30%] shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center pt-2 pb-32 px-6 max-w-md mx-auto w-full z-10">
<div class="w-full flex justify-center mb-6">
<div class="relative">
<div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-100 to-indigo-100 dark:from-blue-900/40 dark:to-indigo-900/40 flex items-center justify-center shadow-sm transform rotate-3">
<span class="material-symbols-outlined text-4xl text-primary drop-shadow-sm">fitness_center</span>
</div>
<div class="absolute inset-0 w-20 h-20 rounded-2xl border border-white/50 dark:border-white/10 rotate-3"></div>
</div>
</div>
<h1 class="text-2xl md:text-3xl font-bold text-center mb-3 text-slate-900 dark:text-white leading-tight">
            How often do you exercise?
        </h1>
<p class="text-center text-secondary-text-light dark:text-secondary-text-dark mb-8 text-sm leading-relaxed max-w-xs">
            Physical activity helps us understand your lifestyle and potential risk factors better.
        </p>
<form class="w-full space-y-3" onsubmit="event.preventDefault();">
<label class="group relative block cursor-pointer select-none">
<input class="peer sr-only" name="activity_level" type="radio" value="sedentary"/>
<div class="relative flex items-center p-4 bg-white dark:bg-card-dark rounded-xl border-2 border-transparent shadow-sm hover:shadow-md transition-all duration-200 peer-checked:border-primary peer-checked:shadow-lg peer-checked:bg-blue-50/50 dark:peer-checked:bg-blue-900/20">
<div class="flex-shrink-0 w-10 h-10 rounded-lg bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-300 flex items-center justify-center mr-4 transition-colors group-hover:bg-blue-100 dark:group-hover:bg-slate-600 peer-checked:bg-primary peer-checked:text-white">
<span class="font-bold text-sm">A</span>
</div>
<div class="flex-grow">
<span class="block text-base font-semibold text-slate-800 dark:text-slate-100">Rarely or never</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-gray-300 dark:border-gray-500 flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all duration-200">
<span class="material-symbols-outlined text-white text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity duration-200">check</span>
</div>
</div>
</label>
<label class="group relative block cursor-pointer select-none">
<input class="peer sr-only" name="activity_level" type="radio" value="light"/>
<div class="relative flex items-center p-4 bg-white dark:bg-card-dark rounded-xl border-2 border-transparent shadow-sm hover:shadow-md transition-all duration-200 peer-checked:border-primary peer-checked:shadow-lg peer-checked:bg-blue-50/50 dark:peer-checked:bg-blue-900/20">
<div class="flex-shrink-0 w-10 h-10 rounded-lg bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-300 flex items-center justify-center mr-4 transition-colors group-hover:bg-blue-100 dark:group-hover:bg-slate-600 peer-checked:bg-primary peer-checked:text-white">
<span class="font-bold text-sm">B</span>
</div>
<div class="flex-grow">
<span class="block text-base font-semibold text-slate-800 dark:text-slate-100">1-2 times a week</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-gray-300 dark:border-gray-500 flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all duration-200">
<span class="material-symbols-outlined text-white text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity duration-200">check</span>
</div>
</div>
</label>
<label class="group relative block cursor-pointer select-none">
<input class="peer sr-only" name="activity_level" type="radio" value="moderate"/>
<div class="relative flex items-center p-4 bg-white dark:bg-card-dark rounded-xl border-2 border-transparent shadow-sm hover:shadow-md transition-all duration-200 peer-checked:border-primary peer-checked:shadow-lg peer-checked:bg-blue-50/50 dark:peer-checked:bg-blue-900/20">
<div class="flex-shrink-0 w-10 h-10 rounded-lg bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-300 flex items-center justify-center mr-4 transition-colors group-hover:bg-blue-100 dark:group-hover:bg-slate-600 peer-checked:bg-primary peer-checked:text-white">
<span class="font-bold text-sm">C</span>
</div>
<div class="flex-grow">
<span class="block text-base font-semibold text-slate-800 dark:text-slate-100">3-4 times a week</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-gray-300 dark:border-gray-500 flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all duration-200">
<span class="material-symbols-outlined text-white text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity duration-200">check</span>
</div>
</div>
</label>
<label class="group relative block cursor-pointer select-none">
<input class="peer sr-only" name="activity_level" type="radio" value="active"/>
<div class="relative flex items-center p-4 bg-white dark:bg-card-dark rounded-xl border-2 border-transparent shadow-sm hover:shadow-md transition-all duration-200 peer-checked:border-primary peer-checked:shadow-lg peer-checked:bg-blue-50/50 dark:peer-checked:bg-blue-900/20">
<div class="flex-shrink-0 w-10 h-10 rounded-lg bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-300 flex items-center justify-center mr-4 transition-colors group-hover:bg-blue-100 dark:group-hover:bg-slate-600 peer-checked:bg-primary peer-checked:text-white">
<span class="font-bold text-sm">D</span>
</div>
<div class="flex-grow">
<span class="block text-base font-semibold text-slate-800 dark:text-slate-100">5+ times a week</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-gray-300 dark:border-gray-500 flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all duration-200">
<span class="material-symbols-outlined text-white text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity duration-200">check</span>
</div>
</div>
</label>
</form>
</main>
<div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark z-20">
<div class="max-w-md mx-auto w-full">
<button class="w-full bg-primary text-white font-semibold py-4 rounded-xl shadow-lg shadow-blue-500/30 flex items-center justify-center transition-transform active:scale-[0.98] hover:bg-primary-dark group">
                Continue
                <span class="material-symbols-outlined ml-2 text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>

</body></html>
